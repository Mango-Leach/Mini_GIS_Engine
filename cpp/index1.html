<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #0b0d10;
  --bg-panel:     #111318;
  --bg-hover:     #191d25;
  --border:       #1e2229;
  --border-light: #272c36;
  --accent:       #4f8ef7;
  --accent-dim:   rgba(79,142,247,0.13);
  --green:        #2ed87a;
  --red:          #f55f5f;
  --amber:        #f5a623;
  --purple:       #9b7cff;
  --text-pri:     #e8eaf0;
  --text-sec:     #6e7a90;
  --text-dim:     #3d4455;
  --mono:         'JetBrains Mono', monospace;
  --sans:         'DM Sans', sans-serif;
  --panel-w:      260px;
}

html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text-pri); font-family:var(--sans); font-size:13px; }

#app { display:grid; grid-template-columns:1fr var(--panel-w); width:100vw; height:100vh; }

/* ── Map ── */
#map-wrap { position:relative; overflow:hidden; }
#map { width:100%; height:100%; background:#0b0d10; }

/* ── Coords ── */
#coords {
  position:absolute; bottom:16px; left:16px;
  font-family:var(--mono); font-size:10px; color:rgba(255,255,255,0.5);
  pointer-events:none; letter-spacing:0.05em; z-index:500;
  background:rgba(11,13,16,0.65); padding:4px 10px; border-radius:4px;
}

/* ── Toast ── */
#toast {
  position:absolute; bottom:16px; left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--bg-panel); border:1px solid var(--border-light);
  color:var(--text-pri); font-family:var(--mono); font-size:11px;
  padding:7px 18px; border-radius:20px; pointer-events:none;
  opacity:0; transition:opacity 0.2s,transform 0.2s; white-space:nowrap; z-index:500;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
#toast.ok   { border-color:var(--green); color:var(--green); }
#toast.err  { border-color:var(--red);   color:var(--red); }

/* ── Poly hint ── */
#poly-hint {
  position:absolute; top:16px; left:50%; transform:translateX(-50%);
  background:var(--bg-panel); border:1px solid var(--border-light);
  font-family:var(--mono); font-size:11px; color:var(--text-sec);
  padding:6px 20px; border-radius:20px; pointer-events:none;
  opacity:0; transition:opacity 0.2s; white-space:nowrap; z-index:500;
}
#poly-hint.show { opacity:1; }
#poly-hint strong { color:var(--text-pri); }

/* ── Panel ── */
#panel { display:flex; flex-direction:column; background:var(--bg-panel); border-left:1px solid var(--border); overflow:hidden; z-index:600; }

#panel-header { padding:18px 16px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }

#panel-title { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }

/* ── Search ── */
#search-wrap { position:relative; }
#search-input {
  width:100%; background:var(--bg); border:1px solid var(--border-light);
  border-radius:6px; color:var(--text-pri); font-family:var(--mono); font-size:11px;
  padding:8px 10px 8px 34px; outline:none; transition:border-color 0.15s;
}
#search-input::placeholder { color:var(--text-dim); }
#search-input:focus { border-color:var(--accent); }
#search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-dim); pointer-events:none; font-size:12px; }
#autocomplete-list { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--bg-panel); border:1px solid var(--border-light); border-radius:6px; overflow:hidden; z-index:1000; display:none; }
#autocomplete-list.open { display:block; }
.ac-item { padding:8px 12px; font-family:var(--mono); font-size:11px; color:var(--text-sec); cursor:pointer; transition:background 0.1s; }
.ac-item:hover { background:var(--bg-hover); color:var(--text-pri); }
.ac-item .ac-match { color:var(--accent); }

/* ── Toolbar ── */
#toolbar { padding:14px 12px 8px; display:flex; flex-direction:column; gap:3px; flex-shrink:0; border-bottom:1px solid var(--border); }
.section-label { font-family:var(--mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-dim); padding:0 6px; margin:6px 0 4px; }
.section-label:first-child { margin-top:0; }
.tool-btn { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--text-sec); font-family:var(--sans); font-size:12px; cursor:pointer; transition:all 0.12s; text-align:left; width:100%; }
.tool-btn:hover { background:var(--bg-hover); color:var(--text-pri); }
.tool-btn.active { background:var(--accent-dim); border-color:rgba(79,142,247,0.25); color:var(--accent); }
.ds-tag { margin-left:auto; font-family:var(--mono); font-size:9px; color:var(--text-dim); white-space:nowrap; flex-shrink:0; }
.tool-btn.active .ds-tag { color:rgba(79,142,247,0.5); }
.tool-icon { width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }

/* ── Results ── */
#results-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#results-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 8px; flex-shrink:0; }
#results-title { font-family:var(--mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-dim); }
#point-count { font-family:var(--mono); font-size:9px; color:var(--text-dim); background:var(--bg); padding:2px 8px; border-radius:10px; border:1px solid var(--border); }
#results-list { flex:1; overflow-y:auto; padding:0 12px 14px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.result-row { display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:5px; cursor:pointer; transition:background 0.1s; gap:8px; }
.result-row:hover { background:var(--bg-hover); }
.result-row.highlighted { background:var(--accent-dim); border-left:2px solid var(--accent); padding-left:6px; }
.result-label { font-family:var(--mono); font-size:11px; color:var(--text-pri); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100px; }
.result-coords { font-family:var(--mono); font-size:10px; color:var(--text-dim); white-space:nowrap; flex-shrink:0; }
.badge { font-family:var(--mono); font-size:9px; padding:2px 6px; border-radius:3px; flex-shrink:0; white-space:nowrap; }
.badge-dist { background:rgba(79,142,247,0.15); color:var(--accent); }
.badge-rank { background:rgba(245,166,35,0.15); color:var(--amber); }
.result-empty { font-family:var(--mono); font-size:11px; color:var(--text-dim); padding:14px 8px; font-style:italic; }

/* ── Modal ── */
#modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; z-index:1000; opacity:0; pointer-events:none; transition:opacity 0.15s; }
#modal-overlay.open { opacity:1; pointer-events:all; }
#modal { background:var(--bg-panel); border:1px solid var(--border-light); border-radius:10px; padding:24px; width:270px; transform:translateY(10px); transition:transform 0.15s; }
#modal-overlay.open #modal { transform:translateY(0); }
#modal h3 { font-family:var(--mono); font-size:12px; font-weight:600; color:var(--text-pri); margin-bottom:4px; }
#modal p { font-size:11px; color:var(--text-sec); font-family:var(--mono); margin-bottom:14px; }
.modal-coord { font-family:var(--mono); font-size:11px; color:var(--accent); background:var(--accent-dim); padding:6px 10px; border-radius:4px; margin-bottom:14px; }
#modal input { width:100%; background:var(--bg); border:1px solid var(--border-light); border-radius:5px; color:var(--text-pri); font-family:var(--mono); font-size:12px; padding:8px 10px; outline:none; margin-bottom:10px; transition:border-color 0.15s; }
#modal input:focus { border-color:var(--accent); }
#modal input::placeholder { color:var(--text-dim); }
.modal-label { font-family:var(--mono); font-size:10px; color:var(--text-sec); display:block; margin-bottom:4px; }
.modal-row { display:flex; gap:8px; margin-top:4px; }
.btn { flex:1; padding:9px; border-radius:5px; border:1px solid var(--border-light); font-family:var(--mono); font-size:11px; font-weight:500; cursor:pointer; transition:all 0.12s; }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover { background:#6aa3f8; }
.btn-ghost { background:transparent; color:var(--text-sec); }
.btn-ghost:hover { background:var(--bg-hover); color:var(--text-pri); }

/* ── Leaflet overrides ── */
.leaflet-container { font-family:var(--mono); background:#0b0d10; }
.leaflet-control-zoom a { background:var(--bg-panel) !important; color:var(--text-sec) !important; border-color:var(--border-light) !important; }
.leaflet-control-zoom a:hover { color:var(--text-pri) !important; }
.leaflet-control-attribution { background:rgba(11,13,16,0.7) !important; color:var(--text-dim) !important; font-size:9px !important; }
.leaflet-control-attribution a { color:var(--text-dim) !important; }

/* Custom tooltip */
.pt-tip { background:var(--bg-panel); border:1px solid var(--border-light) !important; border-radius:4px; color:var(--text-pri); font-family:var(--mono); font-size:10px; padding:3px 8px; box-shadow:none !important; white-space:nowrap; }
.pt-tip::before { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="map-wrap">
    <div id="map"></div>
    <div id="coords">x: 0   y: 0</div>
    <div id="toast"></div>
    <div id="poly-hint">Click existing points to build polygon · <strong>Enter</strong> to finish · <strong>Esc</strong> to cancel</div>
  </div>

  <div id="panel">
    <div id="panel-header">
      <div id="panel-title">GIS Engine</div>
      <div id="search-wrap">
        <span id="search-icon">⌕</span>
        <input id="search-input" type="text" placeholder="Search label…" autocomplete="off">
        <div id="autocomplete-list"></div>
      </div>
    </div>

    <div id="toolbar">
      <div class="section-label">Add / Edit</div>
      <button class="tool-btn active" data-mode="add">
        <span class="tool-icon">＋</span> Add Point
        <span class="ds-tag">AVL + QT + Trie</span>
      </button>
      <button class="tool-btn" data-mode="remove">
        <span class="tool-icon">✕</span> Remove Point
        <span class="ds-tag">AVL + Trie</span>
      </button>

      <div class="section-label">Query</div>
      <button class="tool-btn" data-mode="radius">
        <span class="tool-icon">◎</span> Radius Query
        <span class="ds-tag">QuadTree</span>
      </button>
      <button class="tool-btn" data-mode="knn">
        <span class="tool-icon">⬡</span> K-Nearest (KNN)
        <span class="ds-tag">MinHeap</span>
      </button>
      <button class="tool-btn" data-mode="distance">
        <span class="tool-icon">↔</span> Distance
        <span class="ds-tag">Euclidean</span>
      </button>
      <button class="tool-btn" data-mode="polygon">
        <span class="tool-icon">⬟</span> Polygon Area
        <span class="ds-tag">Shoelace</span>
      </button>

      <div class="section-label">View</div>
      <button class="tool-btn active" id="btn-quadtree">
        <span class="tool-icon">⊞</span> QuadTree Lines
      </button>
      <button class="tool-btn" id="btn-clear">
        <span class="tool-icon">⊘</span> Clear All
      </button>
    </div>

    <div id="results-wrap">
      <div id="results-header">
        <span id="results-title">Points</span>
        <span id="point-count">0 pts</span>
      </div>
      <div id="results-list">
        <div class="result-empty">No points yet. Click the map to add one.</div>
      </div>
    </div>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-title">Add Point</h3>
    <p id="modal-desc">Set a label for this point</p>
    <div class="modal-coord" id="modal-coord"></div>
    <div id="modal-body"></div>
  </div>
</div>

<script type="module">
import { GISEngine } from './src/gisengine.js';

// ─── Engine ───────────────────────────────────────────────────
const engine = new GISEngine();

// ─── Coordinate mapping  ──────────────────────────────────────
// World: -1000..1000  →  lat/lng centred on Pune
// 1000 world units ≈ 0.9 degrees ≈ ~100 km at this latitude
const PUNE   = { lat: 18.5204, lng: 73.8567 };
const SCALE  = 0.0009; // degrees per world unit

function w2ll(wx, wy) {
  return L.latLng(PUNE.lat + wy * SCALE, PUNE.lng + wx * SCALE);
}
function ll2w(lat, lng) {
  return { x: (lng - PUNE.lng) / SCALE, y: (lat - PUNE.lat) / SCALE };
}
// World-unit radius → metres (for L.circle)
function wRadToM(r) { return r * SCALE * 111320; }

// ─── Leaflet map ──────────────────────────────────────────────
const map = L.map('map', { center:[PUNE.lat, PUNE.lng], zoom:13 });

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com/">CARTO</a>',
  subdomains:'abcd', maxZoom:19,
}).addTo(map);

// ─── Layer groups ─────────────────────────────────────────────
const ptLayer  = L.layerGroup().addTo(map);  // point markers
const ovLayer  = L.layerGroup().addTo(map);  // query overlays
const qtLayer  = L.layerGroup().addTo(map);  // quadtree rectangles

// ─── State ────────────────────────────────────────────────────
let mode           = 'add';
let showQT         = true;
let highlightLabel = null;
let queryResults   = [];
let polyPoints     = [];        // Point objects being collected
let distancePair   = [];        // labels
const markerMap    = new Map(); // label → L.circleMarker

// ─── Coord readout ────────────────────────────────────────────
map.on('mousemove', e => {
  const w = ll2w(e.latlng.lat, e.latlng.lng);
  document.getElementById('coords').textContent =
    `x: ${w.x.toFixed(1)}   y: ${w.y.toFixed(1)}`;
});

// ─── Map click → depends on mode ─────────────────────────────
map.on('click', e => {
  const w = ll2w(e.latlng.lat, e.latlng.lng);
  if      (mode === 'add')    openAddModal(w.x, w.y);
  else if (mode === 'radius') openRadiusModal(w.x, w.y);
  else if (mode === 'knn')    openKNNModal(w.x, w.y);
  // remove / distance / polygon are handled via marker clicks
});

// ─── Marker factory ───────────────────────────────────────────
function mkMarker(p, color = '#4f8ef7') {
  const m = L.circleMarker(w2ll(p.x, p.y), {
    radius:6, color, fillColor:color, fillOpacity:0.9, weight:2,
  });
  m.bindTooltip(
    `<b>${p.label}</b><br>x:${p.x.toFixed(0)} y:${p.y.toFixed(0)}`,
    { className:'pt-tip', direction:'top', offset:[0,-8] }
  );
  m.on('click', ev => { L.DomEvent.stopPropagation(ev); onMarkerClick(p); });
  return m;
}

function onMarkerClick(p) {
  if (mode === 'remove') {
    const r = engine.removePoint(p.label);
    if (r.ok) { toast(r.message,'ok'); dropMarker(p.label); redrawQT(); refreshList(); }

  } else if (mode === 'distance') {
    distancePair.push(p.label);
    setColor(p.label, '#9b7cff');
    if (distancePair.length === 2) {
      const r = engine.getDistance(distancePair[0], distancePair[1]);
      if (r.ok) { drawDistLine(r.p1, r.p2); showDistResults(r); }
      distancePair = [];
    } else {
      toast('Now pick the second point', 'ok');
    }

  } else if (mode === 'polygon') {
    const last = polyPoints[polyPoints.length - 1];
    if (last && last.label === p.label) return;
    polyPoints.push(p);
    setColor(p.label, '#f5a623');
    toast(`${p.label} added (${polyPoints.length}) · Enter to finish`, 'ok');
    drawPolyPreview();
  }
}

function addMarker(p, color)  { const m = mkMarker(p, color); m.addTo(ptLayer); markerMap.set(p.label, m); }
function dropMarker(lbl)      { const m = markerMap.get(lbl); if (m) { ptLayer.removeLayer(m); markerMap.delete(lbl); } }
function setColor(lbl, col)   { const m = markerMap.get(lbl); if (m) m.setStyle({ color:col, fillColor:col }); }
function resetColors()        { for (const [,m] of markerMap) m.setStyle({ color:'#4f8ef7', fillColor:'#4f8ef7' }); }
function highlightOne(lbl)    { resetColors(); if (lbl) setColor(lbl, '#ffffff'); }

// ─── QuadTree rectangles ──────────────────────────────────────
function redrawQT() {
  qtLayer.clearLayers();
  if (!showQT) return;
  for (const bb of engine.getQuadTreeBoundaries()) {
    L.rectangle(
      [w2ll(bb.cx - bb.halfWidth, bb.cy - bb.halfHeight),
       w2ll(bb.cx + bb.halfWidth, bb.cy + bb.halfHeight)],
      { color:'#4f8ef7', weight:1, opacity:0.2, fillOpacity:0, dashArray:'4 5', interactive:false }
    ).addTo(qtLayer);
  }
}

// ─── Overlays ─────────────────────────────────────────────────
function clearOverlay() { ovLayer.clearLayers(); }

function drawDistLine(p1, p2) {
  clearOverlay();
  L.polyline([w2ll(p1.x,p1.y), w2ll(p2.x,p2.y)],
    { color:'#4f8ef7', weight:2, dashArray:'6 4', opacity:0.8, interactive:false }
  ).addTo(ovLayer);
}

function drawRadiusOverlay(wx, wy, r, pts) {
  clearOverlay();
  const center = w2ll(wx, wy);
  L.circle(center, { radius:wRadToM(r), color:'#2ed87a', weight:1.5, dashArray:'5 4', opacity:0.7, fillOpacity:0.06, interactive:false }).addTo(ovLayer);
  L.circleMarker(center, { radius:4, color:'#2ed87a', fillColor:'#2ed87a', fillOpacity:1, weight:0, interactive:false }).addTo(ovLayer);
  resetColors();
  for (const e of pts) setColor(e.point.label, '#2ed87a');
}

function drawKNNOverlay(wx, wy, neighbors) {
  clearOverlay();
  const center = w2ll(wx, wy);
  for (const n of neighbors) {
    L.polyline([center, w2ll(n.point.x, n.point.y)],
      { color:'#9b7cff', weight:1, dashArray:'4 4', opacity:0.6, interactive:false }
    ).addTo(ovLayer);
  }
  L.circleMarker(center, { radius:6, color:'#9b7cff', fillColor:'#9b7cff', fillOpacity:0.9, weight:0, interactive:false }).addTo(ovLayer);
  resetColors();
  for (const n of neighbors) setColor(n.point.label, '#2ed87a');
}

// ─── Polygon ──────────────────────────────────────────────────
let polyPreviewLine = null;

function drawPolyPreview() {
  if (polyPreviewLine) ovLayer.removeLayer(polyPreviewLine);
  if (polyPoints.length < 2) return;
  polyPreviewLine = L.polyline(
    polyPoints.map(p => w2ll(p.x, p.y)),
    { color:'#f5a623', weight:1.5, dashArray:'5 4', opacity:0.7, interactive:false }
  ).addTo(ovLayer);
}

function finishPolygon() {
  if (polyPoints.length < 3) { toast('Need at least 3 points','err'); return; }
  const r = engine.calculateArea(polyPoints.map(p => p.label));
  if (polyPreviewLine) { ovLayer.removeLayer(polyPreviewLine); polyPreviewLine = null; }

  if (r.ok) {
    // Filled polygon
    L.polygon(r.vertices.map(p => w2ll(p.x, p.y)), {
      color:'#f5a623', weight:2, opacity:0.9, fillColor:'#f5a623', fillOpacity:0.15, interactive:false
    }).addTo(ovLayer);

    // Area label at centroid
    const cx = r.vertices.reduce((s,p) => s+p.x, 0) / r.vertices.length;
    const cy = r.vertices.reduce((s,p) => s+p.y, 0) / r.vertices.length;
    L.marker(w2ll(cx, cy), {
      icon: L.divIcon({
        className:'',
        html:`<div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#f5a623;text-shadow:0 1px 4px #000;white-space:nowrap;">${r.area.toFixed(1)} u²</div>`,
        iconAnchor:[0,0],
      }), interactive:false,
    }).addTo(ovLayer);

    showAreaResults(r);
    toast(`Area: ${r.area.toFixed(2)} u²`, 'ok');
  } else {
    toast(r.message, 'err');
  }
  for (const p of polyPoints) setColor(p.label, '#4f8ef7');
  polyPoints = [];
  document.getElementById('poly-hint').classList.remove('show');
}

function cancelPolygon() {
  if (polyPreviewLine) { ovLayer.removeLayer(polyPreviewLine); polyPreviewLine = null; }
  for (const p of polyPoints) setColor(p.label, '#4f8ef7');
  polyPoints = [];
  document.getElementById('poly-hint').classList.remove('show');
}

// ─── Keyboard ─────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (mode === 'polygon') {
    if (e.key === 'Enter')  finishPolygon();
    if (e.key === 'Escape') cancelPolygon();
  }
  if (e.key === 'Escape') clearQuery();
});

function clearQuery() {
  clearOverlay();
  cancelPolygon();
  distancePair = [];
  queryResults = [];
  resetColors();
  highlightLabel = null;
  document.getElementById('results-title').textContent = 'Points';
  refreshList();
}

// ─── Mode buttons ─────────────────────────────────────────────
document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    clearQuery();
    if (mode === 'polygon') document.getElementById('poly-hint').classList.add('show');
    // Disable map drag so clicking markers works cleanly in these modes
    if (['remove','distance','polygon'].includes(mode)) map.dragging.disable();
    else map.dragging.enable();
    document.getElementById('map').style.cursor =
      ({add:'crosshair', remove:'not-allowed', radius:'cell', knn:'cell',
        distance:'pointer', polygon:'crosshair'})[mode] || 'grab';
  });
});

document.getElementById('btn-quadtree').addEventListener('click', () => {
  showQT = !showQT;
  document.getElementById('btn-quadtree').classList.toggle('active', showQT);
  redrawQT();
});

document.getElementById('btn-clear').addEventListener('click', () => {
  for (const p of [...engine.getAllPointsSorted()]) engine.removePoint(p.label);
  ptLayer.clearLayers(); markerMap.clear();
  clearOverlay(); redrawQT(); refreshList();
  toast('Cleared all points','ok');
});

// ─── Modals ───────────────────────────────────────────────────
let _px, _py;

function openAddModal(wx, wy) {
  _px = wx; _py = wy;
  document.getElementById('modal-title').textContent = 'Add Point';
  document.getElementById('modal-desc').textContent  = 'Enter a label for this point';
  document.getElementById('modal-coord').textContent = `clicked: (${wx.toFixed(1)}, ${wy.toFixed(1)})`;
  document.getElementById('modal-body').innerHTML = `
    <label class="modal-label">Label</label>
    <input id="ml" type="text" placeholder="e.g. A, Station1…" maxlength="20">
    <div class="modal-row" style="gap:8px;margin-bottom:10px;">
      <div style="flex:1"><label class="modal-label">X</label>
        <input id="mx" type="number" step="any" value="${wx.toFixed(2)}" style="margin-bottom:0"></div>
      <div style="flex:1"><label class="modal-label">Y</label>
        <input id="my" type="number" step="any" value="${wy.toFixed(2)}" style="margin-bottom:0"></div>
    </div>
    <div class="modal-row">
      <button class="btn btn-ghost" id="mc">Cancel</button>
      <button class="btn btn-primary" id="mok">Add</button>
    </div>`;
  openModal();
  setTimeout(() => document.getElementById('ml')?.focus(), 50);
  document.getElementById('mok').onclick = confirmAdd;
  document.getElementById('mc').onclick  = closeModal;
  document.getElementById('ml').onkeydown = e => { if(e.key==='Enter') confirmAdd(); if(e.key==='Escape') closeModal(); };
}

function confirmAdd() {
  const label = document.getElementById('ml')?.value.trim();
  const x     = parseFloat(document.getElementById('mx')?.value);
  const y     = parseFloat(document.getElementById('my')?.value);
  if (!label)           { toast('Label cannot be empty','err'); return; }
  if (isNaN(x)||isNaN(y)){ toast('X and Y must be numbers','err'); return; }
  const r = engine.addPoint(x, y, label);
  closeModal();
  toast(r.message, r.ok ? 'ok' : 'err');
  if (r.ok) {
    addMarker(engine.searchLabel(label));
    redrawQT();
    refreshList();
  }
}

function openRadiusModal(wx, wy) {
  document.getElementById('modal-title').textContent = 'Radius Query';
  document.getElementById('modal-desc').textContent  = 'Find all points within radius';
  document.getElementById('modal-coord').textContent = `center: (${wx.toFixed(1)}, ${wy.toFixed(1)})`;
  document.getElementById('modal-body').innerHTML = `
    <label class="modal-label">Radius (world units)</label>
    <input id="mr" type="number" placeholder="e.g. 200" min="1" max="2000" value="200">
    <div class="modal-row">
      <button class="btn btn-ghost" id="mc">Cancel</button>
      <button class="btn btn-primary" id="mok">Query</button>
    </div>`;
  openModal();
  setTimeout(() => document.getElementById('mr')?.focus(), 50);
  const go = () => {
    const r = parseFloat(document.getElementById('mr').value);
    if (isNaN(r)||r<=0) { toast('Enter a positive radius','err'); return; }
    const res = engine.queryRadius(wx, wy, r);
    closeModal();
    if (!res.ok) { toast(res.message,'err'); return; }
    queryResults = res.points;
    drawRadiusOverlay(wx, wy, r, res.points);
    showRadiusResults(res.points, r);
  };
  document.getElementById('mok').onclick = go;
  document.getElementById('mc').onclick  = closeModal;
  document.getElementById('mr').onkeydown = e => { if(e.key==='Enter') go(); if(e.key==='Escape') closeModal(); };
}

function openKNNModal(wx, wy) {
  document.getElementById('modal-title').textContent = 'K-Nearest Neighbors';
  document.getElementById('modal-desc').textContent  = 'Find K closest points';
  document.getElementById('modal-coord').textContent = `query: (${wx.toFixed(1)}, ${wy.toFixed(1)})`;
  document.getElementById('modal-body').innerHTML = `
    <label class="modal-label">K (number of neighbors)</label>
    <input id="mk" type="number" placeholder="e.g. 3" min="1" max="50" value="3">
    <div class="modal-row">
      <button class="btn btn-ghost" id="mc">Cancel</button>
      <button class="btn btn-primary" id="mok">Find</button>
    </div>`;
  openModal();
  setTimeout(() => document.getElementById('mk')?.focus(), 50);
  const go = () => {
    const k = parseInt(document.getElementById('mk').value);
    if (isNaN(k)||k<=0) { toast('Enter a positive K','err'); return; }
    const res = engine.queryKNN(wx, wy, k);
    closeModal();
    if (!res.ok) { toast(res.message,'err'); return; }
    queryResults = res.neighbors.map(n => ({ point:n.point, distance:n.distance }));
    drawKNNOverlay(wx, wy, res.neighbors);
    showKNNResults(res.neighbors);
  };
  document.getElementById('mok').onclick = go;
  document.getElementById('mc').onclick  = closeModal;
  document.getElementById('mk').onkeydown = e => { if(e.key==='Enter') go(); if(e.key==='Escape') closeModal(); };
}

function openModal()  { document.getElementById('modal-overlay').classList.add('open'); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

// ─── Results panel ────────────────────────────────────────────
function refreshList() {
  const all  = engine.getAllPointsSorted();
  const list = document.getElementById('results-list');
  document.getElementById('results-title').textContent = 'Points';
  document.getElementById('point-count').textContent = `${all.length} pt${all.length!==1?'s':''}`;
  if (all.length === 0) {
    list.innerHTML = '<div class="result-empty">No points yet. Click the map to add one.</div>';
    return;
  }
  list.innerHTML = all.map(p => `
    <div class="result-row ${highlightLabel===p.label?'highlighted':''}" data-label="${p.label}">
      <span class="result-label">${p.label}</span>
      <span class="result-coords">${p.x.toFixed(0)}, ${p.y.toFixed(0)}</span>
    </div>`).join('');
  list.querySelectorAll('.result-row').forEach(row => {
    row.addEventListener('click', () => {
      const lbl = row.dataset.label;
      highlightLabel = highlightLabel===lbl ? null : lbl;
      highlightOne(highlightLabel);
      if (highlightLabel) {
        const p = engine.searchLabel(highlightLabel);
        if (p) map.panTo(w2ll(p.x, p.y));
      }
      refreshList();
    });
  });
}

function showRadiusResults(pts, r) {
  document.getElementById('results-title').textContent = `Radius (r=${r})`;
  document.getElementById('point-count').textContent = `${pts.length} found`;
  const list = document.getElementById('results-list');
  if (pts.length === 0) { list.innerHTML = '<div class="result-empty">No points in radius.</div>'; return; }
  list.innerHTML = pts.map(e => `
    <div class="result-row" data-label="${e.point.label}">
      <span class="result-label">${e.point.label}</span>
      <span class="badge badge-dist">${e.distance.toFixed(1)}</span>
    </div>`).join('');
  rowClicks();
}

function showKNNResults(neighbors) {
  document.getElementById('results-title').textContent = 'K-Nearest';
  document.getElementById('point-count').textContent = `${neighbors.length} found`;
  document.getElementById('results-list').innerHTML = neighbors.map((n,i) => `
    <div class="result-row" data-label="${n.point.label}">
      <span class="result-label">${n.point.label}</span>
      <span class="badge badge-rank">#${i+1} · ${n.distance.toFixed(1)}</span>
    </div>`).join('');
  rowClicks();
}

function showDistResults(r) {
  document.getElementById('results-title').textContent = 'Distance';
  document.getElementById('point-count').textContent = '2 pts';
  document.getElementById('results-list').innerHTML = `
    <div class="result-row highlighted" data-label="${r.p1.label}">
      <span class="result-label">${r.p1.label}</span>
      <span class="result-coords">${r.p1.x.toFixed(0)}, ${r.p1.y.toFixed(0)}</span>
    </div>
    <div class="result-row highlighted" data-label="${r.p2.label}">
      <span class="result-label">${r.p2.label}</span>
      <span class="result-coords">${r.p2.x.toFixed(0)}, ${r.p2.y.toFixed(0)}</span>
    </div>
    <div style="padding:10px 8px;font-family:var(--mono);font-size:11px;">
      <div style="color:var(--text-sec);margin-bottom:6px;">Euclidean: <span style="color:var(--accent)">${r.euclidean.toFixed(2)}</span></div>
      <div style="color:var(--text-sec);">Manhattan: <span style="color:var(--amber)">${r.manhattan.toFixed(2)}</span></div>
    </div>`;
  rowClicks();
}

function showAreaResults(r) {
  document.getElementById('results-title').textContent = 'Polygon Area';
  document.getElementById('point-count').textContent = `${r.vertices.length} verts`;
  document.getElementById('results-list').innerHTML = `
    <div style="padding:10px 8px;font-family:var(--mono);font-size:11px;color:var(--text-sec);">
      Area: <span style="color:var(--green);font-size:16px;font-weight:600;">${r.area.toFixed(2)}</span> units²
    </div>
    ${r.vertices.map(p=>`
    <div class="result-row highlighted">
      <span class="result-label">${p.label}</span>
      <span class="result-coords">${p.x.toFixed(0)}, ${p.y.toFixed(0)}</span>
    </div>`).join('')}`;
}

function rowClicks() {
  document.querySelectorAll('.result-row[data-label]').forEach(row => {
    row.addEventListener('click', () => {
      const lbl = row.dataset.label;
      highlightLabel = highlightLabel===lbl ? null : lbl;
      highlightOne(highlightLabel);
      if (highlightLabel) { const p=engine.searchLabel(lbl); if(p) map.panTo(w2ll(p.x,p.y)); }
    });
  });
}

// ─── Search / Autocomplete ────────────────────────────────────
const si = document.getElementById('search-input');
const al = document.getElementById('autocomplete-list');

si.addEventListener('input', () => {
  const val = si.value.trim();
  if (!val) { al.classList.remove('open'); highlightOne(null); return; }
  const res = engine.autocomplete(val);
  if (!res.length) { al.classList.remove('open'); return; }
  al.innerHTML = res.slice(0,8).map(p =>
    `<div class="ac-item" data-label="${p.label}">
       <span class="ac-match">${p.label.slice(0,val.length)}</span>${p.label.slice(val.length)}
       <span style="color:var(--text-dim);float:right;">(${p.x.toFixed(0)}, ${p.y.toFixed(0)})</span>
     </div>`).join('');
  al.classList.add('open');
  al.querySelectorAll('.ac-item').forEach(item => {
    item.addEventListener('click', () => {
      const lbl = item.dataset.label;
      si.value = lbl; al.classList.remove('open');
      highlightLabel = lbl; highlightOne(lbl);
      const p = engine.searchLabel(lbl);
      if (p) map.panTo(w2ll(p.x, p.y));
      refreshList();
    });
  });
});
document.addEventListener('click', e => { if (!e.target.closest('#search-wrap')) al.classList.remove('open'); });

// ─── Toast ────────────────────────────────────────────────────
let _tt;
function toast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `show ${type}`;
  clearTimeout(_tt); _tt = setTimeout(() => { t.className=''; }, 2500);
}

// ─── Init ─────────────────────────────────────────────────────
const samples = [
  [100,200,'Alpha'],[-300,150,'Beta'],[200,-100,'Gamma'],[-150,-250,'Delta'],[50,50,'Epsilon']
];
for (const [x,y,l] of samples) {
  engine.addPoint(x, y, l);
  addMarker(engine.searchLabel(l));
}
redrawQT();
refreshList();
</script>
</body>
</html>
